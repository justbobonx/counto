<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>counto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a3320;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      background: #1a3320;
    }
    #nameOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      touch-action: auto;
      -webkit-user-select: text;
      user-select: text;
    }
    #nameOverlay.show { display: flex; }
    #nameOverlay input {
      font-size: 18px; /* ≥16 avoids iOS zoom */
      padding: 14px 16px;
      border-radius: 10px;
      border: 2px solid #2a5a3a;
      background: #1a3320;
      color: #fff;
      width: min(80vw, 300px);
      outline: none;
      text-align: center;
    }
    #nameOverlay .row {
      display: flex;
      gap: 10px;
    }
    #nameOverlay button {
      font-size: 16px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    #nameOverlay .ok {
      background: #2a5a3a;
      color: #c8e8c8;
    }
    #nameOverlay .cancel {
      background: #333;
      color: #aaa;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="nameOverlay">
    <input id="nameInput" type="text" maxlength="12" placeholder="Player name" enterkeyhint="done" autocomplete="off" autocorrect="off" />
    <div class="row">
      <button type="button" class="cancel" id="nameCancel">Cancel</button>
      <button type="button" class="ok" id="nameOk">Add</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const nameOverlay = document.getElementById('nameOverlay');
    const nameInput = document.getElementById('nameInput');

    const TOOLBAR_H = 48;
    const BOTTOM_PAD = 52;
    const COL_PAD = 10;
    const MAX_BEADS = 100;
    const MIN_NAME_W = 56;
    const BASE_ASPECT = 1.68;
    const GAP_RATIO = 0.18;

    let players = [];
    let falling = [];
    let resetHoldStart = 0;
    let resetHolding = false;
    let resetDidLong = false;
    let termHoldStart = 0;
    let termHolding = false; // index of player being long-pressed, or -1
    let termDidLong = false;
    let lastPointer = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function widthMult(n) {
      if (n % 10 === 0) return 1.4;
      if (n % 5 === 0) return 1.2;
      return 1.0;
    }

    function getBeadStyle(n) {
      if (n % 10 === 0) return {
        fill: '#3a6ea5',
        outline: '#8eb8e8',
        shine: 'rgba(180,210,255,0.4)'
      };
      if (n % 5 === 0) return {
        fill: '#c62828',
        outline: '#e88888',
        shine: 'rgba(255,180,180,0.35)'
      };
      return {
        fill: '#f5f0d6',
        outline: '#8a8a7a',
        shine: 'rgba(255,255,230,0.4)'
      };
    }

    function layout() {
      const n = Math.max(players.length, 1);
      const colW = canvas.width / n;
      const maxBeadW = Math.max(6, colW - COL_PAD);
      const topY = TOOLBAR_H + 18;
      const bottomY = canvas.height - BOTTOM_PAD;
      const stringH = Math.max(bottomY - topY, 20);

      let maxC = 0;
      for (const p of players) maxC = Math.max(maxC, p.count);
      for (const b of falling) maxC = Math.max(maxC, b.n);

      // needed beads + 2 for top headroom; min 10 for default zoom; max 100
      const fit = Math.min(Math.max(maxC + 2, 10), MAX_BEADS);
      const slot = stringH / fit;

      let beadH = slot * (1 - GAP_RATIO);
      let gap = slot * GAP_RATIO;
      let baseW = beadH * BASE_ASPECT;

      const widest = baseW * 1.4;
      if (widest > maxBeadW) {
        baseW = maxBeadW / 1.4;
        beadH = baseW / BASE_ASPECT;
        gap = beadH * GAP_RATIO;
      }

      beadH = Math.max(2.5, beadH);
      gap = Math.max(0.6, gap);
      baseW = Math.max(5, baseW);

      return { n, colW, maxBeadW, topY, bottomY, stringH, beadH, baseW, gap, maxC };
    }

    function addPlayer() {
      nameInput.value = '';
      nameOverlay.classList.add('show');
      // focus after paint so mobile keyboard opens
      requestAnimationFrame(() => {
        nameInput.focus();
        nameInput.click();
      });
    }

    function commitName() {
      const name = nameInput.value.trim();
      nameOverlay.classList.remove('show');
      nameInput.blur();
      if (name) {
        players.push({ name: name.slice(0, 12), count: 0 });
      }
    }

    function cancelName() {
      nameOverlay.classList.remove('show');
      nameInput.blur();
    }

    document.getElementById('nameOk').addEventListener('click', commitName);
    document.getElementById('nameCancel').addEventListener('click', cancelName);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        commitName();
      } else if (e.key === 'Escape') {
        cancelName();
      }
    });

    function removePlayer(i) {
      if (i < 0 || i >= players.length) return;
      players.splice(i, 1);
      // drop falling beads for this player; shift indices above
      falling = falling.filter(b => b.player !== i).map(b => {
        if (b.player > i) b.player--;
        return b;
      });
    }

    function clearCounts() {
      for (const p of players) p.count = 0;
      falling = [];
    }

    function clearAll() {
      players = [];
      falling = [];
    }

    function allZero() {
      return players.every(p => p.count === 0) && falling.length === 0;
    }

    function pendingFor(i) {
      return falling.filter(b => b.player === i).length;
    }

    function spawnDrop(i, L) {
      const p = players[i];
      const nextN = p.count + pendingFor(i) + 1;
      const style = getBeadStyle(nextN);
      const x = (i + 0.5) * L.colW;
      const w = L.baseW * widthMult(nextN);
      const targetY = L.bottomY - nextN * (L.beadH + L.gap) + L.beadH / 2;
      falling.push({
        player: i,
        n: nextN,
        x, y: L.topY + 16, targetY,
        w, h: L.beadH,
        color: style.fill,
        outline: style.outline,
        shine: style.shine,
        vy: 0
      });
    }

    function hitTest(x, y) {
      if (y < TOOLBAR_H) {
        if (x < 56) return { type: 'reset' };
        if (x > canvas.width - 56) return { type: 'add' };
        return null;
      }
      if (players.length === 0) return null;
      const L = layout();
      const i = Math.floor(x / L.colW);
      if (i < 0 || i >= players.length) return null;
      const cx = (i + 0.5) * L.colW;
      const termR = 14;
      if (Math.hypot(x - cx, y - L.topY) < termR + 6) return { type: 'term', i };
      if (y > L.bottomY - 6 && y < canvas.height - 4) return { type: 'name', i };
      return null;
    }

    function onPointerDown(e) {
      if (nameOverlay.classList.contains('show')) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;
      lastPointer = { x, y };
      const hit = hitTest(x, y);
      if (hit && hit.type === 'reset') {
        resetHolding = true;
        resetHoldStart = performance.now();
        resetDidLong = false;
        termHolding = -1;
      } else if (hit && hit.type === 'term') {
        termHolding = hit.i;
        termHoldStart = performance.now();
        termDidLong = false;
        resetHolding = false;
      } else {
        resetHolding = false;
        termHolding = -1;
      }
    }

    function onPointerUp(e) {
      if (nameOverlay.classList.contains('show')) return;
      e.preventDefault();
      if (!lastPointer) return;
      const x = lastPointer.x;
      const y = lastPointer.y;
      lastPointer = null;

      const hit = hitTest(x, y);

      // terminal long-press already handled in update
      if (termDidLong) {
        termDidLong = false;
        termHolding = -1;
        resetHolding = false;
        return;
      }

      if (hit && hit.type === 'reset') {
        if (resetDidLong) {
          resetDidLong = false;
          resetHolding = false;
          return;
        }
        const held = resetHolding && (performance.now() - resetHoldStart >= 900);
        resetHolding = false;
        if (held) {
          clearCounts();
        } else if (allZero()) {
          clearAll();
        }
        return;
      }

      resetHolding = false;
      resetDidLong = false;

      if (!hit) {
        termHolding = -1;
        return;
      }

      if (hit.type === 'add') {
        termHolding = -1;
        addPlayer();
        return;
      }
      if (hit.type === 'name') {
        termHolding = -1;
        const L = layout();
        spawnDrop(hit.i, L);
        return;
      }
      if (hit.type === 'term') {
        // short tap: remove one bead (or pending)
        const i = hit.i;
        termHolding = -1;
        for (let fi = falling.length - 1; fi >= 0; fi--) {
          if (falling[fi].player === i) {
            falling.splice(fi, 1);
            return;
          }
        }
        if (players[i] && players[i].count > 0) players[i].count--;
        return;
      }
      termHolding = -1;
    }

    function onPointerMove(e) {
      if (lastPointer && (resetHolding || termHolding >= 0)) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        if (Math.hypot(x - lastPointer.x, y - lastPointer.y) > 20) {
          resetHolding = false;
          termHolding = -1;
        }
      }
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', () => {
      resetHolding = false;
      termHolding = -1;
      lastPointer = null;
    });
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('touchstart', onPointerDown, {passive: false});
    canvas.addEventListener('touchend', onPointerUp, {passive: false});

    function update(dt) {
      for (let i = falling.length - 1; i >= 0; i--) {
        const b = falling[i];
        b.vy += 1800 * dt;
        b.y += b.vy * dt;
        if (b.y >= b.targetY) {
          b.y = b.targetY;
          const p = players[b.player];
          if (p && b.n === p.count + 1) {
            p.count = b.n;
          } else if (p) {
            p.count = Math.max(p.count, b.n);
          }
          falling.splice(i, 1);
        }
      }
      if (resetHolding && performance.now() - resetHoldStart >= 1000) {
        clearCounts();
        resetHolding = false;
        resetDidLong = true;
      }
      if (termHolding >= 0 && performance.now() - termHoldStart >= 1000) {
        removePlayer(termHolding);
        termHolding = -1;
        termDidLong = true;
      }
    }

    function draw() {
      const L = layout();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f2214';
      ctx.fillRect(0, 0, canvas.width, TOOLBAR_H);
      ctx.strokeStyle = '#1a3a24';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, TOOLBAR_H - 0.5);
      ctx.lineTo(canvas.width, TOOLBAR_H - 0.5);
      ctx.stroke();

      const btnY = TOOLBAR_H / 2;
      ctx.fillStyle = resetHolding ? '#3a6a4a' : '#2a5a3a';
      ctx.beginPath();
      ctx.roundRect(10, 8, 36, 32, 6);
      ctx.fill();
      ctx.fillStyle = '#a8d0b0';
      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('↻', 28, btnY + 1);

      ctx.fillStyle = '#2a5a3a';
      ctx.beginPath();
      ctx.roundRect(canvas.width - 46, 8, 36, 32, 6);
      ctx.fill();
      ctx.fillStyle = '#a8d0b0';
      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.fillText('+', canvas.width - 28, btnY + 1);

      if (players.length === 0) {
        ctx.fillStyle = '#4a6a50';
        ctx.font = '18px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Tap + to add players', canvas.width / 2, canvas.height / 2);
        return;
      }

      for (let i = 0; i < players.length; i++) {
        const p = players[i];
        const cx = (i + 0.5) * L.colW;

        ctx.strokeStyle = '#3a5a3a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, L.topY + 12);
        ctx.lineTo(cx, L.bottomY);
        ctx.stroke();

        // terminal — highlight while holding
        const holdingThis = termHolding === i;
        ctx.fillStyle = holdingThis ? '#888' : '#6a6a6a';
        ctx.beginPath();
        ctx.arc(cx, L.topY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8a8a8a';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#c8c8c8';
        ctx.font = 'bold 16px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('−', cx, L.topY + 0.5);

        for (let k = 1; k <= p.count; k++) {
          const by = L.bottomY - k * (L.beadH + L.gap) + L.beadH / 2;
          const w = L.baseW * widthMult(k);
          drawBead(cx, by, w, L.beadH, getBeadStyle(k));
        }

        const fs = Math.min(15, Math.max(10, L.colW / (p.name.length * 0.55 + 2)));
        ctx.font = `bold ${fs}px system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const textW = ctx.measureText(p.name).width + 14;
        const tw = Math.min(L.colW - 4, Math.max(MIN_NAME_W, textW));
        ctx.fillStyle = '#122818';
        ctx.beginPath();
        ctx.roundRect(cx - tw / 2, L.bottomY + 8, tw, 30, 8);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillText(p.name, cx, L.bottomY + 23);
      }

      for (const b of falling) {
        drawBead(b.x, b.y, b.w, b.h, {
          fill: b.color,
          outline: b.outline,
          shine: b.shine
        });
      }
    }

    function drawBead(x, y, w, h, style) {
      ctx.fillStyle = style.fill;
      ctx.beginPath();
      ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = style.outline;
      ctx.lineWidth = Math.max(1, h * 0.12);
      ctx.stroke();
      ctx.fillStyle = style.shine;
      ctx.beginPath();
      ctx.ellipse(x, y - h * 0.18, w * 0.28, h * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
