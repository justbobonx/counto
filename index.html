<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>counto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a3320;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      background: #1a3320;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let players = [];
    // falling: {player, n, x, y, targetY, w, h, color, vy}
    let falling = [];
    let resetHoldStart = 0;
    let resetHolding = false;
    let resetDidLong = false; // after long-press clear, ignore the subsequent up for name-clear
    let lastPointer = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function getBeadColor(n) {
      if (n % 10 === 0) return '#1a1a1a';
      if (n % 5 === 0) return '#c62828';
      return '#f5f0e6';
    }

    function layout() {
      const n = Math.max(players.length, 1);
      const colW = canvas.width / n;
      const topPad = 48;
      const bottomPad = 56;
      const topY = topPad;
      const bottomY = canvas.height - bottomPad;
      const stringH = Math.max(bottomY - topY, 20);
      let maxC = 0;
      for (const p of players) maxC = Math.max(maxC, p.count);
      for (const b of falling) maxC = Math.max(maxC, b.n);
      const maxBeads = Math.max(maxC, 8);
      const beadH = Math.min(14, Math.max(6, stringH / (maxBeads + 3)));
      const beadW = Math.min(colW * 0.65, 36);
      const gap = beadH * 0.25;
      return { n, colW, topY, bottomY, stringH, beadH, beadW, gap, maxC };
    }

    function addPlayer() {
      const name = prompt('Player name:');
      if (name && name.trim()) {
        players.push({ name: name.trim().slice(0, 12), count: 0 });
      }
    }

    function clearCounts() {
      for (const p of players) p.count = 0;
      falling = [];
    }

    function clearAll() {
      players = [];
      falling = [];
    }

    function allZero() {
      return players.every(p => p.count === 0) && falling.length === 0;
    }

    function pendingFor(i) {
      return falling.filter(b => b.player === i).length;
    }

    function spawnDrop(i, L) {
      const p = players[i];
      const nextN = p.count + pendingFor(i) + 1;
      const color = getBeadColor(nextN);
      const x = (i + 0.5) * L.colW;
      const targetY = L.bottomY - nextN * (L.beadH + L.gap) + L.beadH / 2;
      falling.push({
        player: i,
        n: nextN,
        x, y: L.topY + 20, targetY,
        w: L.beadW, h: L.beadH,
        color, vy: 0
      });
    }

    function hitTest(x, y) {
      const L = layout();
      if (x < 44 && y < 44) return { type: 'reset' };
      if (x > canvas.width - 52 && y > canvas.height - 52) return { type: 'add' };
      if (players.length === 0) return null;
      const i = Math.floor(x / L.colW);
      if (i < 0 || i >= players.length) return null;
      const cx = (i + 0.5) * L.colW;
      const termR = 14;
      if (Math.hypot(x - cx, y - L.topY) < termR + 6) return { type: 'term', i };
      if (y > L.bottomY - 8 && y < canvas.height - 8) return { type: 'name', i };
      return null;
    }

    function onPointerDown(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;
      lastPointer = { x, y };
      const hit = hitTest(x, y);
      if (hit && hit.type === 'reset') {
        resetHolding = true;
        resetHoldStart = performance.now();
        resetDidLong = false;
      } else {
        resetHolding = false;
      }
    }

    function onPointerUp(e) {
      e.preventDefault();
      if (!lastPointer) return;
      const x = lastPointer.x;
      const y = lastPointer.y;
      lastPointer = null;

      const hit = hitTest(x, y);

      if (hit && hit.type === 'reset') {
        // if this press already did a long-press clear, require release+repress for name clear
        if (resetDidLong) {
          resetDidLong = false;
          resetHolding = false;
          return;
        }
        const held = resetHolding && (performance.now() - resetHoldStart >= 900);
        resetHolding = false;
        if (held) {
          clearCounts();
        } else if (allZero()) {
          clearAll();
        }
        return;
      }

      resetHolding = false;
      resetDidLong = false;

      if (!hit) return;

      if (hit.type === 'add') {
        addPlayer();
        return;
      }
      if (hit.type === 'name') {
        const L = layout();
        spawnDrop(hit.i, L);
        return;
      }
      if (hit.type === 'term') {
        const p = players[hit.i];
        // cancel any pending falling for this player first, then reduce count
        for (let fi = falling.length - 1; fi >= 0; fi--) {
          if (falling[fi].player === hit.i) {
            falling.splice(fi, 1);
            return; // removed one pending drop instead of touching landed count
          }
        }
        if (p.count > 0) p.count--;
        return;
      }
    }

    function onPointerMove(e) {
      if (resetHolding && lastPointer) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        if (Math.hypot(x - lastPointer.x, y - lastPointer.y) > 20) {
          resetHolding = false;
        }
      }
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', () => { resetHolding = false; lastPointer = null; });
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('touchstart', onPointerDown, {passive: false});
    canvas.addEventListener('touchend', onPointerUp, {passive: false});

    function update(dt) {
      for (let i = falling.length - 1; i >= 0; i--) {
        const b = falling[i];
        b.vy += 1800 * dt;
        b.y += b.vy * dt;
        if (b.y >= b.targetY) {
          b.y = b.targetY;
          // land: only then increase the count
          const p = players[b.player];
          if (p && b.n === p.count + 1) {
            p.count = b.n;
          } else if (p) {
            p.count = Math.max(p.count, b.n);
          }
          falling.splice(i, 1);
        }
      }
      // long press clears counts; mark so the following pointerup does not also clear names
      if (resetHolding && performance.now() - resetHoldStart >= 1000) {
        clearCounts();
        resetHolding = false;
        resetDidLong = true;
      }
    }

    function draw() {
      const L = layout();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // reset button
      ctx.fillStyle = resetHolding ? '#666' : '#333';
      ctx.beginPath();
      ctx.roundRect(8, 8, 32, 32, 6);
      ctx.fill();
      ctx.fillStyle = '#aaa';
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('↻', 24, 25);

      // + button
      ctx.fillStyle = '#2a5a2a';
      ctx.beginPath();
      ctx.arc(canvas.width - 28, canvas.height - 28, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8f8';
      ctx.font = 'bold 28px system-ui, sans-serif';
      ctx.fillText('+', canvas.width - 28, canvas.height - 26);

      if (players.length === 0) {
        ctx.fillStyle = '#555';
        ctx.font = '18px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Tap + to add players', canvas.width / 2, canvas.height / 2);
        return;
      }

      for (let i = 0; i < players.length; i++) {
        const p = players[i];
        const cx = (i + 0.5) * L.colW;

        // string
        ctx.strokeStyle = '#3a5a3a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, L.topY + 14);
        ctx.lineTo(cx, L.bottomY);
        ctx.stroke();

        // terminal
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.arc(cx, L.topY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#bbb';
        ctx.lineWidth = 2;
        ctx.stroke();

        // landed beads only (count)
        for (let k = 1; k <= p.count; k++) {
          const by = L.bottomY - k * (L.beadH + L.gap) + L.beadH / 2;
          const color = getBeadColor(k);
          drawBead(cx, by, L.beadW, L.beadH, color);
        }

        // name
        const fs = Math.min(16, Math.max(10, L.colW / (p.name.length * 0.55 + 2)));
        ctx.font = `bold ${fs}px system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(p.name).width + 12;
        ctx.fillStyle = '#1a2a1a';
        ctx.beginPath();
        ctx.roundRect(cx - tw / 2, L.bottomY + 6, tw, 28, 8);
        ctx.fill();
        ctx.fillStyle = '#eee';
        ctx.fillText(p.name, cx, L.bottomY + 20);
      }

      // falling beads (not yet counted)
      for (const b of falling) {
        drawBead(b.x, b.y, b.w, b.h, b.color);
      }
    }

    function drawBead(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color === '#1a1a1a' ? '#444' : 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
      if (color !== '#1a1a1a') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.ellipse(x, y - h * 0.15, w * 0.3, h * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
