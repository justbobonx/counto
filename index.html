<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>counto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a3320;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      background: #1a3320;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const TOOLBAR_H = 48;
    const BOTTOM_PAD = 52;

    // preferred bead size — only shrink when the stack would exceed string height
    const DESIRED_BEAD_H = 18;
    const DESIRED_GAP = 3;
    const MAX_BEADS = 100;

    let players = [];
    let falling = [];
    let resetHoldStart = 0;
    let resetHolding = false;
    let resetDidLong = false;
    let lastPointer = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function getBeadStyle(n) {
      if (n % 10 === 0) return {
        fill: '#3a6ea5',
        outline: '#8eb8e8',
        shine: 'rgba(180,210,255,0.4)'
      };
      if (n % 5 === 0) return {
        fill: '#c62828',
        outline: '#e88888',
        shine: 'rgba(255,180,180,0.35)'
      };
      return {
        fill: '#f5f0d6',
        outline: '#fff8e0',
        shine: 'rgba(255,255,230,0.4)'
      };
    }

    function layout() {
      const n = Math.max(players.length, 1);
      const colW = canvas.width / n;
      const topY = TOOLBAR_H + 18;
      const bottomY = canvas.height - BOTTOM_PAD;
      const stringH = Math.max(bottomY - topY, 20);

      let maxC = 0;
      for (const p of players) maxC = Math.max(maxC, p.count);
      for (const b of falling) maxC = Math.max(maxC, b.n);

      // size as if at least 10 beads (default zoom), up to 100
      const need = Math.max(maxC, 10);
      const fit = Math.min(need, MAX_BEADS);

      // fixed preferred spacing — only scale down when the tight stack won't fit
      const natural = fit * (DESIRED_BEAD_H + DESIRED_GAP);
      let scale = 1;
      if (natural > stringH - 8) {
        scale = (stringH - 8) / natural;
      }
      const beadH = Math.max(2.5, DESIRED_BEAD_H * scale);
      const gap = Math.max(0.8, DESIRED_GAP * scale);

      // width: as wide as column allows, no extra horizontal spacing
      const beadW = Math.min(colW * 0.7, Math.max(8, beadH * 2.8));

      return { n, colW, topY, bottomY, stringH, beadH, beadW, gap, maxC };
    }

    function addPlayer() {
      const name = prompt('Player name:');
      if (name && name.trim()) {
        players.push({ name: name.trim().slice(0, 12), count: 0 });
      }
    }

    function clearCounts() {
      for (const p of players) p.count = 0;
      falling = [];
    }

    function clearAll() {
      players = [];
      falling = [];
    }

    function allZero() {
      return players.every(p => p.count === 0) && falling.length === 0;
    }

    function pendingFor(i) {
      return falling.filter(b => b.player === i).length;
    }

    function spawnDrop(i, L) {
      const p = players[i];
      const nextN = p.count + pendingFor(i) + 1;
      const style = getBeadStyle(nextN);
      const x = (i + 0.5) * L.colW;
      const targetY = L.bottomY - nextN * (L.beadH + L.gap) + L.beadH / 2;
      falling.push({
        player: i,
        n: nextN,
        x, y: L.topY + 16, targetY,
        w: L.beadW, h: L.beadH,
        color: style.fill,
        outline: style.outline,
        shine: style.shine,
        vy: 0
      });
    }

    function hitTest(x, y) {
      if (y < TOOLBAR_H) {
        if (x < 56) return { type: 'reset' };
        if (x > canvas.width - 56) return { type: 'add' };
        return null;
      }
      if (players.length === 0) return null;
      const L = layout();
      const i = Math.floor(x / L.colW);
      if (i < 0 || i >= players.length) return null;
      const cx = (i + 0.5) * L.colW;
      const termR = 14;
      if (Math.hypot(x - cx, y - L.topY) < termR + 6) return { type: 'term', i };
      if (y > L.bottomY - 6 && y < canvas.height - 4) return { type: 'name', i };
      return null;
    }

    function onPointerDown(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;
      lastPointer = { x, y };
      const hit = hitTest(x, y);
      if (hit && hit.type === 'reset') {
        resetHolding = true;
        resetHoldStart = performance.now();
        resetDidLong = false;
      } else {
        resetHolding = false;
      }
    }

    function onPointerUp(e) {
      e.preventDefault();
      if (!lastPointer) return;
      const x = lastPointer.x;
      const y = lastPointer.y;
      lastPointer = null;

      const hit = hitTest(x, y);

      if (hit && hit.type === 'reset') {
        if (resetDidLong) {
          resetDidLong = false;
          resetHolding = false;
          return;
        }
        const held = resetHolding && (performance.now() - resetHoldStart >= 900);
        resetHolding = false;
        if (held) {
          clearCounts();
        } else if (allZero()) {
          clearAll();
        }
        return;
      }

      resetHolding = false;
      resetDidLong = false;

      if (!hit) return;

      if (hit.type === 'add') {
        addPlayer();
        return;
      }
      if (hit.type === 'name') {
        const L = layout();
        spawnDrop(hit.i, L);
        return;
      }
      if (hit.type === 'term') {
        for (let fi = falling.length - 1; fi >= 0; fi--) {
          if (falling[fi].player === hit.i) {
            falling.splice(fi, 1);
            return;
          }
        }
        const p = players[hit.i];
        if (p.count > 0) p.count--;
        return;
      }
    }

    function onPointerMove(e) {
      if (resetHolding && lastPointer) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        if (Math.hypot(x - lastPointer.x, y - lastPointer.y) > 20) {
          resetHolding = false;
        }
      }
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', () => { resetHolding = false; lastPointer = null; });
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('touchstart', onPointerDown, {passive: false});
    canvas.addEventListener('touchend', onPointerUp, {passive: false});

    function update(dt) {
      for (let i = falling.length - 1; i >= 0; i--) {
        const b = falling[i];
        b.vy += 1800 * dt;
        b.y += b.vy * dt;
        if (b.y >= b.targetY) {
          b.y = b.targetY;
          const p = players[b.player];
          if (p && b.n === p.count + 1) {
            p.count = b.n;
          } else if (p) {
            p.count = Math.max(p.count, b.n);
          }
          falling.splice(i, 1);
        }
      }
      if (resetHolding && performance.now() - resetHoldStart >= 1000) {
        clearCounts();
        resetHolding = false;
        resetDidLong = true;
      }
    }

    function draw() {
      const L = layout();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // toolbar
      ctx.fillStyle = '#0f2214';
      ctx.fillRect(0, 0, canvas.width, TOOLBAR_H);
      ctx.strokeStyle = '#1a3a24';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, TOOLBAR_H - 0.5);
      ctx.lineTo(canvas.width, TOOLBAR_H - 0.5);
      ctx.stroke();

      const btnY = TOOLBAR_H / 2;
      ctx.fillStyle = resetHolding ? '#3a6a4a' : '#2a5a3a';
      ctx.beginPath();
      ctx.roundRect(10, 8, 36, 32, 6);
      ctx.fill();
      ctx.fillStyle = '#a8d0b0';
      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('↻', 28, btnY + 1);

      ctx.fillStyle = '#2a5a3a';
      ctx.beginPath();
      ctx.roundRect(canvas.width - 46, 8, 36, 32, 6);
      ctx.fill();
      ctx.fillStyle = '#a8d0b0';
      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.fillText('+', canvas.width - 28, btnY + 1);

      if (players.length === 0) {
        ctx.fillStyle = '#4a6a50';
        ctx.font = '18px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Tap + to add players', canvas.width / 2, canvas.height / 2);
        return;
      }

      for (let i = 0; i < players.length; i++) {
        const p = players[i];
        const cx = (i + 0.5) * L.colW;

        // string
        ctx.strokeStyle = '#3a5a3a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, L.topY + 12);
        ctx.lineTo(cx, L.bottomY);
        ctx.stroke();

        // terminal — grey with light grey minus
        ctx.fillStyle = '#6a6a6a';
        ctx.beginPath();
        ctx.arc(cx, L.topY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8a8a8a';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#c8c8c8';
        ctx.font = 'bold 16px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('−', cx, L.topY + 0.5);

        // landed beads — tight stack from bottom, no extra spread
        for (let k = 1; k <= p.count; k++) {
          const by = L.bottomY - k * (L.beadH + L.gap) + L.beadH / 2;
          drawBead(cx, by, L.beadW, L.beadH, getBeadStyle(k));
        }

        // name — white text
        const fs = Math.min(15, Math.max(10, L.colW / (p.name.length * 0.55 + 2)));
        ctx.font = `bold ${fs}px system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(p.name).width + 14;
        ctx.fillStyle = '#122818';
        ctx.beginPath();
        ctx.roundRect(cx - tw / 2, L.bottomY + 8, tw, 28, 8);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillText(p.name, cx, L.bottomY + 22);
      }

      for (const b of falling) {
        drawBead(b.x, b.y, b.w, b.h, {
          fill: b.color,
          outline: b.outline,
          shine: b.shine
        });
      }
    }

    function drawBead(x, y, w, h, style) {
      ctx.fillStyle = style.fill;
      ctx.beginPath();
      ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = style.outline;
      ctx.lineWidth = Math.max(1, h * 0.12);
      ctx.stroke();
      ctx.fillStyle = style.shine;
      ctx.beginPath();
      ctx.ellipse(x, y - h * 0.18, w * 0.28, h * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
